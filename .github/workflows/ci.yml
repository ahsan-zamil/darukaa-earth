name: Darukaa.Earth CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-lint-and-test:
    name: Backend Lint & Test (FastAPI + Pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: darukaa_earth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Code Quality & Linting (Ruff & Black)
        run: |
          ruff check backend/
          black --check backend/

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/darukaa_earth_test
          JWT_SECRET: ci-test-secret-key-12345
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
        run: |
          cd backend
          alembic upgrade head
          pytest -v

  frontend-lint-and-build:
    name: Frontend Lint & Build (React + TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Frontend Code Quality & ESLint
        run: |
          cd frontend
          npm run lint

      - name: TypeScript Type Check & Production Build
        run: |
          cd frontend
          npm run build
